name: Checks
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: windscope
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: windscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windscope -d windscope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://windscope:test-only@localhost:5432/windscope_test
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://windscope:test-only@localhost:5432/windscope_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test && npm run lint && npm run build
