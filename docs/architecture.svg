<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">WindScope application architecture</title>
<desc id="desc">React runs in the buyer's browser. Docker hosts Nginx, FastAPI, a manually invoked ingestion CLI, Alembic migrations and PostgreSQL. The CLI retrieves Elexon wind forecasts and actuals and archives them in PostgreSQL. FastAPI reads the archive and calculates cutoff-aware historical analytics. Dashboard requests do not contact Elexon.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7963a6"/></marker></defs>
<rect width="1600" height="1000" fill="#f5f8fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="65" font-size="36" fill="#142d44" font-weight="700">WindScope | Application architecture</text>
<text x="60" y="104" font-size="22" fill="#34465b" font-weight="400">January 2026 historical analysis · Elexon wind forecasts and actuals</text>
<rect x="60" y="155" width="480" height="160" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="60" y="173" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="84" y="197" font-size="24" fill="#142d44" font-weight="700">Buyer’s browser</text>
<text x="84" y="237" font-size="19" fill="#34465b" font-weight="400">React + TypeScript · TanStack Query</text>
<text x="84" y="267" font-size="19" fill="#34465b" font-weight="400">ECharts · validated API responses</text>
<text x="84" y="297" font-size="19" fill="#34465b" font-weight="400">Filters, snapshots and CSV exports</text>
<rect x="1150" y="155" width="390" height="160" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="1150" y="173" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="1174" y="197" font-size="24" fill="#142d44" font-weight="700">Elexon Insights API</text>
<text x="1174" y="237" font-size="19" fill="#34465b" font-weight="400">WINDFOR: forecast publications</text>
<text x="1174" y="267" font-size="19" fill="#34465b" font-weight="400">FUELHH: WIND actuals</text>
<text x="1174" y="297" font-size="19" fill="#34465b" font-weight="400">External source · HTTPS</text>
<rect x="30" y="360" width="1540" height="555" rx="22" fill="#eaf1f6" stroke="#b4c6d7" stroke-width="2" stroke-dasharray="9 7"/>
<text x="60" y="394" font-size="17" fill="#50677e" font-weight="700">DOCKER COMPOSE · LOCAL STACK</text>
<rect x="60" y="430" width="480" height="255" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="60" y="448" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="84" y="472" font-size="24" fill="#142d44" font-weight="700">Nginx · frontend service</text>
<text x="84" y="512" font-size="19" fill="#34465b" font-weight="400">Serves the built React application</text>
<text x="84" y="542" font-size="19" fill="#34465b" font-weight="400">Proxies /api, /docs and /openapi.json</text>
<text x="84" y="572" font-size="19" fill="#34465b" font-weight="400">SPA deep-link fallback</text>
<text x="84" y="602" font-size="19" fill="#34465b" font-weight="400">Entry point: localhost:8080</text>
<rect x="620" y="430" width="450" height="255" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="620" y="448" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="644" y="472" font-size="24" fill="#142d44" font-weight="700">FastAPI · API service</text>
<text x="644" y="512" font-size="19" fill="#34465b" font-weight="400">Validated read-only HTTP endpoints</text>
<text x="644" y="542" font-size="19" fill="#34465b" font-weight="400">Latest forecast at/before UK cutoff</text>
<text x="644" y="572" font-size="19" fill="#34465b" font-weight="400">Exact timestamp matching</text>
<text x="644" y="602" font-size="19" fill="#34465b" font-weight="400">MAE, RMSE, bias and coverage</text>
<text x="644" y="632" font-size="19" fill="#34465b" font-weight="400">Snapshot and source fingerprint</text>
<rect x="1150" y="430" width="390" height="170" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="1150" y="448" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="1174" y="472" font-size="24" fill="#142d44" font-weight="700">Ingestion CLI · explicit job</text>
<text x="1174" y="512" font-size="19" fill="#34465b" font-weight="400">Fetch → validate → archive</text>
<text x="1174" y="542" font-size="19" fill="#34465b" font-weight="400">Bounded retries · atomic windows</text>
<text x="1174" y="572" font-size="19" fill="#34465b" font-weight="400">Append-only, idempotent imports</text>
<rect x="1150" y="705" width="390" height="175" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="1150" y="723" width="5" height="36" rx="2" fill="#167d8d"/>
<text x="1174" y="747" font-size="24" fill="#142d44" font-weight="700">PostgreSQL · persistent volume</text>
<text x="1174" y="787" font-size="19" fill="#34465b" font-weight="400">Forecast vintages + WIND actuals</text>
<text x="1174" y="817" font-size="19" fill="#34465b" font-weight="400">Raw payloads and content hashes</text>
<text x="1174" y="847" font-size="19" fill="#34465b" font-weight="400">Ingestion runs and record links</text>
<rect x="620" y="760" width="450" height="120" rx="16" fill="white" stroke="#cdd9e3" stroke-width="2"/>
<rect x="620" y="778" width="5" height="36" rx="2" fill="#7963a6"/>
<text x="644" y="802" font-size="24" fill="#142d44" font-weight="700">Alembic · migration service</text>
<text x="644" y="842" font-size="19" fill="#34465b" font-weight="400">Applies schema before API starts</text>
<path d="M 300 315 V 430" fill="none" stroke="#167d8d" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="322" y="345" font-size="17" fill="#34465b" font-weight="400">Static assets / JSON API</text>
<path d="M 540 530 H 620" fill="none" stroke="#167d8d" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="550" y="514" font-size="16" fill="#34465b" font-weight="400">HTTP</text>
<path d="M 1345 315 V 430" fill="none" stroke="#167d8d" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1362" y="345" font-size="17" fill="#34465b" font-weight="400">Source records</text>
<path d="M 1345 600 V 705" fill="none" stroke="#167d8d" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1362" y="656" font-size="17" fill="#34465b" font-weight="400">Store</text>
<path d="M 1070 560 H 1110 V 740 H 1150" fill="none" stroke="#167d8d" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="980" y="715" font-size="17" fill="#34465b" font-weight="400">Read archive</text>
<path d="M 1070 820 H 1150" fill="none" stroke="#7963a6" stroke-width="3" stroke-linejoin="round" marker-end="url(#purple)" stroke-dasharray="8 6"/>
<text x="60" y="752" font-size="21" fill="#142d44" font-weight="700">Analysis rule</text>
<text x="60" y="788" font-size="19" fill="#34465b" font-weight="400">Latest publishTime ≤ previous-day UK cutoff</text>
<text x="60" y="820" font-size="19" fill="#34465b" font-weight="400">Forecast and actual startTime must match</text>
<text x="60" y="852" font-size="19" fill="#34465b" font-weight="400">No interpolation; missing values stay missing</text>
<text x="60" y="951" font-size="20" fill="#34465b" font-weight="400">Dashboard requests use stored data. Ingestion is manually invoked; no scheduler or trading execution is implemented.</text>
</g></svg>
