services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: windscope
      POSTGRES_USER: windscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windscope -d windscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://windscope:${POSTGRES_PASSWORD}@db:5432/windscope
      CORS_ORIGINS: '["http://localhost:5173"]'
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
